# Pause automatic merges with DEPENDENCY_AUTOMATION_PAUSED=true.
name: Fleet dependency updates
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Audit or apply tested updates with agent compatibility review
        type: choice
        required: true
        default: audit
        options:
        - audit
        - apply
  schedule:
  - cron: 43 4,16 * * *
permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read
  deployments: write
  statuses: read
concurrency:
  group: fleet-compatible-dependencies
  cancel-in-progress: false
jobs:
  gate:
    if: vars.DEPENDENCY_AUTOMATION_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Verify and apply tested dependency updates
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: "const policy = {\"repository\":\"ClaraCrazy/ClaraCrazy\",\"branch\":\"slut\",\"dependencyFiles\"\
          :[],\"requiredWorkflows\":[],\"mergeMethod\":\"rebase\"};\n// Embedded in a default-branch workflow. Never\
          \ check out or execute PR code here.\nfunction compatibleVersion(before, after) {\n  const parse = value\
          \ => /^v?(\\d+)\\.(\\d+)\\.(\\d+)$/.exec(value)?.slice(1).map(Number);\n  const old = parse(before), next\
          \ = parse(after);\n  if (!old || !next || old[0] !== next[0]) return false;\n  if (old[0] === 0 && old[1]\
          \ !== next[1]) return false;\n  return next[1] > old[1] || next[1] === old[1] && next[2] > old[2];\n}\n\
          function reviewedUpdate(pr, policy) {\n  return (policy.reviews || []).find(review => review.pr === pr.number\
          \ &&\n    review.head === pr.head.sha && review.base === pr.base.sha &&\n    review.compatibility ===\
          \ 'verified' && typeof review.rationale === 'string' && review.rationale.trim().length >= 40 &&\n    Array.isArray(review.evidence)\
          \ && review.evidence.length > 0 &&\n    review.evidence.every(url => typeof url === 'string' && /^https:\\\
          /\\//.test(url)) &&\n    Array.isArray(review.allowedFiles));\n}\nfunction classify(pr, commits, files,\
          \ policy) {\n  if (!policy.requiredWorkflows.length) return 'no meaningful CI configured';\n  if (pr.state\
          \ !== 'open' || pr.draft || pr.user.login !== 'dependabot[bot]') return 'not an open Dependabot PR';\n\
          \  if (pr.base.ref !== policy.branch || pr.head.repo?.full_name !== policy.repository || !pr.head.ref.startsWith('dependabot/'))\
          \ return 'branch or repository mismatch';\n  if (pr.labels.some(label => /^(hold|manual|breaking|do-not-merge|review-required)$/i.test(label.name)))\
          \ return 'manual hold';\n  const review = reviewedUpdate(pr, policy);\n  if (!review && /maintainer changes|\\\
          bbreaking changes?\\b|\\bbreaking-change\\b/i.test(pr.body || '')) return 'agent compatibility review\
          \ pending';\n  if (commits.length !== 1 || commits[0].sha !== pr.head.sha || commits[0].author?.login\
          \ !== 'dependabot[bot]' || !commits[0].commit.verification?.verified) return 'unverified or edited bot\
          \ commit';\n  const message = commits[0].commit.message;\n  if ((message.match(/^\\s*-?\\s*dependency-name:/gm)\
          \ || []).length !== 1) return 'grouped or unknown dependency metadata';\n  if (!review && !/^\\s*update-type:\
          \ version-update:semver-(patch|minor)\\s*$/m.test(message)) return 'agent compatibility review pending';\n\
          \  const versions = /^Bumps .+ from (v?\\d+\\.\\d+\\.\\d+) to (v?\\d+\\.\\d+\\.\\d+)\\.$/m.exec(message);\n\
          \  if (!review && (!versions || !compatibleVersion(versions[1], versions[2]))) return 'agent compatibility\
          \ review pending';\n  if (!files.length || files.length > 50 || files.some(file => file.status !== 'modified'\
          \ ||\n    !policy.dependencyFiles.includes(file.filename) && !(review?.allowedFiles.includes(file.filename)\
          \ && /^\\.github\\/workflows\\/[^/]+\\.ya?ml$/.test(file.filename)))) return 'changes outside reviewed\
          \ dependency files';\n  return null;\n}\nfunction successfulRun(run, jobs, workflow) {\n  return run.status\
          \ === 'completed' && run.conclusion === 'success' && jobs.length > 0 &&\n    jobs.filter(job => job.conclusion\
          \ !== 'skipped').every(job => job.status === 'completed' && job.conclusion === 'success') &&\n    workflow.steps.every(name\
          \ => jobs.some(job => job.conclusion === 'success' && job.steps?.some(step => step.name === name && step.status\
          \ === 'completed' && step.conclusion === 'success')));\n}\nasync function run(github, context, core, policy)\
          \ {\n  const repo = context.repo;\n  if (`${repo.owner}/${repo.repo}` !== policy.repository) throw new\
          \ Error('Repository policy mismatch');\n  const apply = context.eventName !== 'workflow_dispatch' || context.payload.inputs?.mode\
          \ === 'apply';\n  const summary = {mode: apply ? 'apply' : 'audit', assessed: 0, merged: [], held: []};\n\
          \  // Repository variables are controlled by administrators, not by PR content.\n  // Keeping reviews\
          \ outside Git avoids advancing the base SHA just to record approval.\n  const reviews = JSON.parse(process.env.DEPENDENCY_REVIEWS\
          \ || '{\"schema\":1,\"reviews\":[]}');\n  if (reviews.schema !== 1 || !Array.isArray(reviews.reviews))\
          \ throw new Error('Invalid dependency review registry');\n  policy = {...policy, reviews: reviews.reviews};\n\
          \  const prs = await github.paginate(github.rest.pulls.list, {...repo, state: 'open', base: policy.branch,\
          \ per_page: 100});\n  for (const item of prs.filter(pr => pr.user.login === 'dependabot[bot]').sort((a,b)\
          \ => a.number-b.number)) {\n    const {data: pr} = await github.rest.pulls.get({...repo, pull_number:\
          \ item.number});\n    summary.assessed++;\n    const commits = await github.paginate(github.rest.pulls.listCommits,\
          \ {...repo, pull_number: pr.number, per_page: 100});\n    const files = await github.paginate(github.rest.pulls.listFiles,\
          \ {...repo, pull_number: pr.number, per_page: 100});\n    let held = classify(pr, commits, files, policy);\n\
          \    if (!held) {\n      for (const file of files.filter(file => file.filename.endsWith('/package.json')\
          \ || file.filename === 'package.json')) {\n        const get = async ref => JSON.parse(Buffer.from((await\
          \ github.rest.repos.getContent({...repo, path: file.filename, ref})).data.content, 'base64').toString('utf8'));\n\
          \        const before = await get(pr.base.sha), after = await get(pr.head.sha);\n        for (const field\
          \ of ['dependencies','devDependencies','optionalDependencies','peerDependencies']) { delete before[field];\
          \ delete after[field]; }\n        if (JSON.stringify(before) !== JSON.stringify(after)) held = 'package\
          \ scripts or non-dependency configuration changed';\n      }\n    }\n    if (!held) {\n      for (const\
          \ workflow of policy.requiredWorkflows) {\n        const {data} = await github.rest.actions.listWorkflowRuns({...repo,\
          \ workflow_id: workflow.path, head_sha: pr.head.sha, event: 'pull_request', per_page: 100});\n       \
          \ const latest = data.workflow_runs.sort((a,b) => b.id-a.id)[0];\n        if (!latest) {held = `missing\
          \ CI: ${workflow.path}`; break;}\n        const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun,\
          \ {...repo, run_id: latest.id, filter: 'latest', per_page: 100});\n        if (!successfulRun(latest,\
          \ jobs, workflow)) {held = `CI incomplete or failed: ${workflow.path}`; break;}\n      }\n    }\n    if\
          \ (!held) {\n      const checks = await github.paginate(github.rest.checks.listForRef, {...repo, ref:\
          \ pr.head.sha, per_page: 100});\n      if (checks.some(check => ['failure','cancelled','timed_out','action_required','startup_failure'].includes(check.conclusion)))\
          \ held = 'another check failed';\n      if (checks.some(check => check.status !== 'completed')) held =\
          \ 'another check is still running';\n      const {data: status} = await github.rest.repos.getCombinedStatusForRef({...repo,\
          \ ref: pr.head.sha});\n      if (status.total_count > 0 && status.state !== 'success') held = 'legacy\
          \ status checks are incomplete or failed';\n    }\n    if (!held) {\n      const {data: branch} = await\
          \ github.rest.repos.getBranch({...repo, branch: policy.branch});\n      const {data: comparison} = await\
          \ github.rest.repos.compareCommitsWithBasehead({...repo, basehead: `${branch.commit.sha}...${pr.head.sha}`});\n\
          \      if (comparison.behind_by !== 0 || comparison.status !== 'ahead') held = 'branch needs rebasing\
          \ and retesting';\n      const {data: fresh} = await github.rest.pulls.get({...repo, pull_number: pr.number});\n\
          \      if (fresh.head.sha !== pr.head.sha || fresh.base.sha !== branch.commit.sha || fresh.mergeable !==\
          \ true || fresh.mergeable_state !== 'clean') held = 'PR changed or mergeability not verified';\n    }\n\
          \    if (held) {summary.held.push({pr: pr.number, reason: held}); continue;}\n    if (!apply) {summary.held.push({pr:\
          \ pr.number, reason: 'eligible; audit mode'}); continue;}\n    // sha is the server-enforced compare-and-swap\
          \ guard. Never enable blind platform auto-merge.\n    const {data: merged} = await github.rest.pulls.merge({...repo,\
          \ pull_number: pr.number, sha: pr.head.sha, merge_method: policy.mergeMethod});\n    if (!merged.merged)\
          \ throw new Error(`Merge was not confirmed for PR ${pr.number}; reconcile before retrying`);\n    summary.merged.push({pr:\
          \ pr.number, sha: merged.sha});\n    if (policy.deployWorkflow) {\n      const {data: branch} = await\
          \ github.rest.repos.getBranch({...repo, branch: policy.branch});\n      if (branch.commit.sha !== merged.sha)\
          \ throw new Error('Branch advanced before deploy; no dispatch submitted');\n      await github.rest.actions.createWorkflowDispatch({...repo,\
          \ workflow_id: policy.deployWorkflow, ref: policy.branch,\n        inputs: {kind: 'dependencies', reason:\
          \ `Tested compatible Dependabot PR ${pr.number}`, dry_run: 'false', skip_docker_smoke: 'false', expected_sha:\
          \ merged.sha}});\n    }\n    if (policy.deploymentQueue) {\n      await github.rest.repos.createDeployment({...repo,\
          \ ref: merged.sha, environment: 'production', task: 'dependency-update', auto_merge: false, required_contexts:\
          \ [],\n        description: `Tested compatible Dependabot PR ${pr.number}`, payload: {schema: 1, kind:\
          \ 'compatible-dependency-update', pr: pr.number, tested_head: pr.head.sha, workflow_run: context.runId}});\n\
          \    }\n    // One merge per run: later branches must rebase and rerun their tests.\n    break;\n  }\n\
          \  core.info(JSON.stringify(summary));\n  await core.summary.addHeading('Dependency update gate').addCodeBlock(JSON.stringify(summary,null,2),'json').write();\n\
          \  return summary;\n}\n\nawait run(github, context, core, policy);\n"
      env:
        DEPENDENCY_REVIEWS: ${{ vars.DEPENDENCY_REVIEWS }}
